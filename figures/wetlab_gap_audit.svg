<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-label="Wet lab data gap audit"><style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#21182b} .muted{fill:#6e6576} .white{fill:#fff} .bold{font-weight:700} .small{font-size:13px} .med{font-size:16px} .big{font-size:22px;font-weight:700}
    </style><rect width="1080" height="420" rx="24" fill="#fbf9fd"/><text x="40" y="48" class="big">Wet-lab data gap audit</text><text x="40" y="76" class="small muted">Current audit counts fields needed for sustainability/traceability; it is not a score of scientific quality.</text><rect x="40" y="110" width="578.9" height="44" rx="10" fill="#9a4650"/><rect x="618.9" y="110" width="368.4" height="44" fill="#d4942f"/><rect x="987.4" y="110" width="52.6" height="44" rx="10" fill="#b7b0bc"/><text x="55" y="139" class="white med bold">Critical 11</text><text x="636.9" y="139" class="white med bold">High 7</text><text x="993.4" y="139" class="small bold">N/A 1</text><text x="40" y="194" class="med bold">Highest-value gaps to close next</text><circle cx="48" cy="230" r="7" fill="#9a4650"/><text x="64" y="235" class="small bold">OD600 time points</text><text x="255" y="235" class="small muted">separate biomass growth from pathway efficiency</text><circle cx="48" cy="272" r="7" fill="#9a4650"/><text x="64" y="277" class="small bold">Initial + residual precursor</text><text x="255" y="277" class="small muted">substrate consumption and Yield</text><circle cx="48" cy="314" r="7" fill="#9a4650"/><text x="64" y="319" class="small bold">Metabolite 14</text><text x="255" y="319" class="small muted">important demethylation product</text><circle cx="48" cy="356" r="7" fill="#9a4650"/><text x="64" y="361" class="small bold">Glabridin time series</text><text x="255" y="361" class="small muted">Titer / Productivity</text><circle cx="558" cy="230" r="7" fill="#9a4650"/><text x="574" y="235" class="small bold">Actual material inventory</text><text x="830" y="235" class="small muted">PMI / water / solvent / cost</text><circle cx="558" cy="272" r="7" fill="#9a4650"/><text x="574" y="277" class="small bold">Biological replicates + standards</text><text x="830" y="277" class="small muted">statistics and reproducibility</text><circle cx="558" cy="314" r="7" fill="#d4942f"/><text x="574" y="319" class="small bold">DMT activity 9/10/11</text><text x="830" y="319" class="small muted">explain substrate preference</text><circle cx="558" cy="356" r="7" fill="#d4942f"/><text x="574" y="361" class="small bold">Safety / containment</text><text x="830" y="361" class="small muted">negative-impact mitigation</text><text x="40" y="397" class="small muted">Process-light fields are intentionally removed because the current production system no longer uses light control.</text></svg>