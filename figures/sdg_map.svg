<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-label="SDG 3, 12 and 9 mapping"><style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#21182b} .muted{fill:#6e6576} .white{fill:#fff} .bold{font-weight:700} .small{font-size:13px} .med{font-size:16px} .big{font-size:22px;font-weight:700}
    </style><rect width="1080" height="390" rx="24" fill="#fbf9fd"/><text x="40" y="48" class="big">One coherent sustainability story</text><rect x="45" y="90" width="300" height="220" rx="22" fill="#fff" stroke="#4c9f38" stroke-width="3"/><rect x="45" y="90" width="300" height="55" rx="20" fill="#4c9f38"/><text x="67" y="126" class="white big">SDG 3</text><text x="67" y="180" class="med bold">WHY it should matter</text><text x="67" y="210" class="small muted"><tspan x="67" dy="0">Real skin-health needs</tspan></text><text x="67" y="250" class="small bold">Evidence</text><text x="67" y="270" class="small muted"><tspan x="67" dy="0">Safety · efficacy</tspan><tspan x="67" dy="16">product evidence</tspan></text><rect x="388" y="90" width="300" height="220" rx="22" fill="#fff" stroke="#bf8b2e" stroke-width="3"/><rect x="388" y="90" width="300" height="55" rx="20" fill="#bf8b2e"/><text x="410" y="126" class="white big">SDG 12</text><text x="410" y="180" class="med bold">HOW to produce responsibly</text><text x="410" y="210" class="small muted"><tspan x="410" dy="0">Lower burden per unit product</tspan></text><text x="410" y="250" class="small bold">Evidence</text><text x="410" y="270" class="small muted"><tspan x="410" dy="0">Substrate · PMI · water</tspan><tspan x="410" dy="16">solvent · waste · energy</tspan></text><rect x="731" y="90" width="300" height="220" rx="22" fill="#fff" stroke="#fd6925" stroke-width="3"/><rect x="731" y="90" width="300" height="55" rx="20" fill="#fd6925"/><text x="753" y="126" class="white big">SDG 9</text><text x="753" y="180" class="med bold">CAN it become a real process?</text><text x="753" y="210" class="small muted"><tspan x="753" dy="0">Reliable biomanufacturing</tspan></text><text x="753" y="250" class="small bold">Evidence</text><text x="753" y="270" class="small muted"><tspan x="753" dy="0">Productivity · purity · recovery</tspan><tspan x="753" dy="16">batch CV · cost</tspan></text><path d="M345 200 L375 200" stroke="#8b5bb8" stroke-width="4"/><path d="M370 194 L380 200 L370 206" fill="none" stroke="#8b5bb8" stroke-width="4"/><path d="M688 200 L718 200" stroke="#8b5bb8" stroke-width="4"/><path d="M713 194 L723 200 L713 206" fill="none" stroke="#8b5bb8" stroke-width="4"/><text x="40" y="352" class="small muted">SDG 3 defines purpose; SDG 12 evaluates per-product resource burden; SDG 9 tests industrial plausibility.</text></svg>