<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-label="Protocol to process inventory"><style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#21182b} .muted{fill:#6e6576} .white{fill:#fff} .bold{font-weight:700} .small{font-size:13px} .med{font-size:16px} .big{font-size:22px;font-weight:700}
    </style><rect width="1080" height="350" rx="24" fill="#fbf9fd"/><text x="40" y="48" class="big">Protocol → recurring production inventory</text><circle cx="60" cy="113" r="21" fill="#6f3ca7"/><text x="54" y="119" class="white med bold">1</text><rect x="35" y="145" width="150" height="120" rx="14" fill="#fff" stroke="#ded4e7"/><text x="49" y="173" class="med bold">Expansion</text><text x="49" y="198" class="small muted"><tspan x="49" dy="0">Culture medium</tspan><tspan x="49" dy="17">actual volume / time / RPM</tspan></text><path d="M185 205 L207 205" stroke="#8b5bb8" stroke-width="3"/><path d="M202 200 L209 205 L202 210" fill="none" stroke="#8b5bb8" stroke-width="3"/><circle cx="234" cy="113" r="21" fill="#6f3ca7"/><text x="228" y="119" class="white med bold">2</text><rect x="209" y="145" width="150" height="120" rx="14" fill="#fff" stroke="#ded4e7"/><text x="223" y="173" class="med bold">Induction</text><text x="223" y="198" class="small muted"><tspan x="223" dy="0">Galactose if applicable</tspan><tspan x="223" dy="17">actual amount</tspan></text><path d="M359 205 L381 205" stroke="#8b5bb8" stroke-width="3"/><path d="M376 200 L383 205 L376 210" fill="none" stroke="#8b5bb8" stroke-width="3"/><circle cx="408" cy="113" r="21" fill="#6f3ca7"/><text x="402" y="119" class="white med bold">3</text><rect x="383" y="145" width="150" height="120" rx="14" fill="#fff" stroke="#ded4e7"/><text x="397" y="173" class="med bold">Fermentation</text><text x="397" y="198" class="small muted"><tspan x="397" dy="0">Precursor + OD600</tspan><tspan x="397" dy="17">Day 1/3/5/7/10</tspan></text><path d="M533 205 L555 205" stroke="#8b5bb8" stroke-width="3"/><path d="M550 200 L557 205 L550 210" fill="none" stroke="#8b5bb8" stroke-width="3"/><circle cx="582" cy="113" r="21" fill="#6f3ca7"/><text x="576" y="119" class="white med bold">4</text><rect x="557" y="145" width="150" height="120" rx="14" fill="#fff" stroke="#ded4e7"/><text x="571" y="173" class="med bold">Harvest</text><text x="571" y="198" class="small muted"><tspan x="571" dy="0">Centrifuge</tspan><tspan x="571" dy="17">volume + use time</tspan></text><path d="M707 205 L729 205" stroke="#8b5bb8" stroke-width="3"/><path d="M724 200 L731 205 L724 210" fill="none" stroke="#8b5bb8" stroke-width="3"/><circle cx="756" cy="113" r="21" fill="#6f3ca7"/><text x="750" y="119" class="white med bold">5</text><rect x="731" y="145" width="150" height="120" rx="14" fill="#fff" stroke="#ded4e7"/><text x="745" y="173" class="med bold">Extraction</text><text x="745" y="198" class="small muted"><tspan x="745" dy="0">Water + ethyl acetate</tspan><tspan x="745" dy="17">sonication</tspan></text><path d="M881 205 L903 205" stroke="#8b5bb8" stroke-width="3"/><path d="M898 200 L905 205 L898 210" fill="none" stroke="#8b5bb8" stroke-width="3"/><circle cx="930" cy="113" r="21" fill="#6f3ca7"/><text x="924" y="119" class="white med bold">6</text><rect x="905" y="145" width="150" height="120" rx="14" fill="#fff" stroke="#ded4e7"/><text x="919" y="173" class="med bold">Analysis</text><text x="919" y="198" class="small muted"><tspan x="919" dy="0">Rotavap + methanol</tspan><tspan x="919" dy="17">chromatography / purity</tspan></text><text x="40" y="312" class="small muted">Protocol defines the stages; accounting still needs actual per-batch quantities, sampling volumes, use time and rated power.</text></svg>